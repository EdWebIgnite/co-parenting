<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Design tokens from DESIGN.md / design canvas */
:root{
  --background:#FAF8F5; --card:#FFFFFF; --foreground:#1F2430; --muted:#F1EDE7; --muted-foreground:#5B6170;
  --border:#E3DED6; --input:#868B98; --primary:#0E6B66; --primary-foreground:#FFFFFF; --primary-soft:#DDEFEC; --ring:#0E6B66;
  --parent-a:#3D4FB8; --parent-a-foreground:#FFFFFF; --parent-a-soft:#E3E7F8; --parent-a-text:#2A3788;
  --parent-b:#E9A23B; --parent-b-border:#9A6200; --parent-b-foreground:#3D2A00; --parent-b-soft:#FBEBCB; --parent-b-text:#6B4700;
  --destructive:#B42318; --destructive-soft:#FDECEA; --success:#1F6B4A; --success-soft:#E2F1E9; --caution:#8A4B00;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --tap:48px;
  --font:'Atkinson Hyperlegible Next',system-ui,'Segoe UI',Roboto,sans-serif;
}
body.hc{
  --background:#F5F6F7; --card:#FFFFFF; --foreground:#171B22; --muted:#ECEEF1; --muted-foreground:#525967;
  --border:#D9DDE2; --input:#7C8492; --primary:#27364A; --primary-foreground:#FFFFFF; --primary-soft:#E6EAF0; --ring:#27364A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:#d9d6cf;color:var(--foreground);font-size:16px;line-height:24px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.i.s{width:16px;height:16px;stroke-width:2}
.phone{max-width:430px;min-height:100vh;margin:0 auto;background:var(--background);position:relative;display:flex;flex-direction:column}
.proto{background:#222;color:#eee;font-size:12px;line-height:16px;padding:6px 8px;display:flex;gap:6px;align-items:center}
.proto b{color:#fff}
.proto .seg{display:inline-flex;border:1px solid #555;border-radius:999px;overflow:hidden}
.proto .seg button{background:none;border:0;color:#ccc;padding:4px 8px;font-size:12px}
.proto .seg button.on{background:#eee;color:#222}
.proto .reset{margin-left:auto;background:none;border:1px solid #555;color:#ccc;border-radius:999px;padding:4px 8px;font-size:12px}
header.top{display:flex;align-items:center;gap:12px;padding:16px 16px 8px;background:var(--background);position:sticky;top:0;z-index:20}
header.top .ttl{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
header.top .date{font-size:14px;line-height:20px;color:var(--muted-foreground)}
header.top h1{font-size:24px;line-height:30px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.badge{height:28px;padding:0 10px;border-radius:var(--r-sm);background:var(--primary-soft);color:var(--foreground);font-size:14px;line-height:28px;font-weight:600;white-space:nowrap}
.iconbtn{width:48px;height:48px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--foreground);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.iconbtn.sm{width:40px;height:40px}
main{flex:1;padding:8px 16px 104px;display:flex;flex-direction:column}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:calc(72px + env(safe-area-inset-bottom));padding:0 4px env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));z-index:20}
nav.tabs button{border:0;background:none;font-size:12px;line-height:16px;font-weight:500;color:var(--muted-foreground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
nav.tabs .ic{width:56px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center}
nav.tabs button.on{color:var(--primary);font-weight:700}
nav.tabs button.on .ic{background:var(--primary-soft)}
nav.tabs .dot{position:absolute;top:8px;left:calc(50% + 10px);background:var(--destructive);color:#fff;font-size:11px;line-height:16px;font-weight:700;border-radius:999px;padding:0 5px;min-width:18px;text-align:center}
h2{font-size:20px;line-height:26px;font-weight:600;margin:0 0 12px}
h3{font-size:18px;line-height:24px;font-weight:600;margin:24px 0 12px;color:var(--foreground)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.card.tight{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;min-height:64px;background:none;border:0;border-bottom:1px solid var(--border);width:100%;text-align:left;color:inherit}
.card .row:last-child,.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0;font-weight:500}
.row .sub{font-size:14px;line-height:20px;color:var(--muted-foreground);font-weight:400}
.chev{color:var(--muted-foreground);display:flex}
.muted{color:var(--muted-foreground)}
.small{font-size:14px;line-height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--tap);padding:0 20px;border-radius:var(--r-md);border:1.5px solid var(--primary);background:var(--primary);color:var(--primary-foreground);font-size:16px;font-weight:600;line-height:20px;text-align:center}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:var(--card);color:var(--primary)}
.btn.text{background:transparent;border-color:transparent;color:var(--primary);padding:0 12px}
.btn.warn{background:var(--destructive);border-color:var(--destructive);color:#fff}
.btn.block{width:100%}
.btn.sm{height:40px;padding:0 14px;font-size:14px}
.btn:disabled{background:var(--muted);border-color:var(--muted);color:var(--muted-foreground);cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1}
.pill{height:28px;padding:0 10px 0 8px;border-radius:var(--r-sm);background:var(--muted);color:var(--foreground);font-size:14px;line-height:20px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;box-sizing:border-box}
.pill.ok{background:var(--success-soft);color:var(--success)}
.pill.warn{background:var(--destructive-soft);color:var(--destructive)}
.pill.wait{background:var(--muted);color:var(--foreground)}
.pill.reply{background:var(--primary-soft);color:var(--foreground)}
.pill.caution{background:var(--card);border:1.5px solid var(--caution);color:var(--caution)}
.pill.info{background:var(--primary-soft);color:var(--foreground)}
.chip{height:28px;padding:0 10px 0 4px;border-radius:999px;font-size:14px;line-height:20px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip .ini{width:20px;height:20px;border-radius:999px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.chip.me{background:var(--parent-a-soft);color:var(--parent-a-text)} .chip.me .ini{background:var(--parent-a);color:var(--parent-a-foreground)}
.chip.other{background:var(--parent-b-soft);color:var(--parent-b-text)} .chip.other .ini{background:var(--parent-b);border:1.5px solid var(--parent-b-border);color:var(--parent-b-foreground)}
.banner{border-radius:var(--r-md);padding:12px;font-size:14px;line-height:20px;margin-bottom:12px;background:var(--primary-soft);color:var(--foreground);display:flex;gap:8px;align-items:flex-start}
.banner > .i{width:20px;height:20px}
.banner .bt{flex:1}
.banner.lock{background:var(--muted)}
.banner.warn{background:var(--destructive-soft);color:var(--destructive)}
.note{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:20px;color:var(--muted-foreground);margin:8px 0}
.note .i{width:20px;height:20px}
.who{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;box-sizing:border-box}
.av.me{background:var(--parent-a);color:var(--parent-a-foreground)} .av.other{background:var(--parent-b);color:var(--parent-b-foreground);border:2px solid var(--parent-b-border)} .av.kid{background:var(--primary-soft);color:var(--primary)}
.big{font-size:20px;line-height:26px;font-weight:700}
dl.facts{margin:0}
dl.facts > div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
dl.facts dt{font-size:14px;line-height:20px;color:var(--muted-foreground)}
dl.facts dd{margin:0;font-weight:500;text-align:right}
label.f{display:block;font-size:14px;line-height:20px;font-weight:600;margin:16px 0 6px}
input.f,select.f,textarea.f{width:100%;min-width:0;height:var(--tap);border:1.5px solid var(--input);border-radius:var(--r-md);padding:0 14px;background:var(--card);font-size:16px}
input.f:focus,select.f:focus,textarea.f:focus{outline:3px solid var(--primary-soft);border:2px solid var(--primary)}
textarea.f{height:auto;min-height:96px;padding:12px 14px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:16px;margin:12px 0}
.check input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--primary)}
input[type=checkbox]{accent-color:var(--primary)}
.choice{display:block;width:100%;text-align:left;border:1.5px solid var(--input);background:var(--card);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.choice.on{border:2px solid var(--primary);background:var(--primary-soft)}
.choice b{display:block;font-size:18px;line-height:24px;margin-bottom:4px}
.legal{font-size:12px;color:var(--destructive);font-weight:700;letter-spacing:.05em}

/* flat home layout */
.hero{padding:8px 0 20px}
.hero .av{width:48px;height:48px;font-size:18px}
.hero-t{font-size:24px;line-height:30px;font-weight:700}
.flat-sec{padding:20px 0;border-top:1px solid var(--border)}
.lbl{font-size:14px;line-height:20px;font-weight:600;color:var(--muted-foreground);margin-bottom:8px}
.hand{display:flex;flex-direction:column;font-size:18px;line-height:26px}
.hand .muted{font-size:16px;line-height:24px}
.links{display:flex;gap:16px;margin-top:4px}
.links .btn.text{padding:0}
.flat .row{padding-left:0;padding-right:0;min-height:56px}
.flat .row .when{width:56px;font-size:14px;line-height:20px;flex:none}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.grid .dow{font-size:12px;line-height:16px;text-align:center;color:var(--muted-foreground);padding:4px 0;font-weight:600}
.day{min-height:44px;aspect-ratio:1/1.1;border-radius:var(--r-sm);border:0;padding:4px 2px;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;position:relative}
.day.me{background:var(--parent-a-soft);color:var(--parent-a-text)} .day.other{background:var(--parent-b-soft);color:var(--parent-b-text)}
.day.out{opacity:.4}
.day.today{outline:2px solid var(--foreground);outline-offset:-2px}
.day .marks{display:flex;gap:2px}
.day .m{width:6px;height:6px;border-radius:50%;background:var(--foreground)}
.day .m.hol{background:var(--destructive)}
.day .m.term{background:var(--primary)}
.day .m.swap{width:6px;height:6px;border-radius:1px;background:var(--foreground);transform:rotate(45deg)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;line-height:16px;color:var(--muted-foreground);margin:12px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
/* messages */
.chat{display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.msg{max-width:84%;padding:10px 14px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--border);align-self:flex-start;position:relative}
.msg.mine{align-self:flex-end;background:var(--primary-soft);border-color:transparent}
.msg.removed{font-style:italic;color:var(--muted-foreground);background:none}
.msg .meta{font-size:12px;line-height:16px;color:var(--muted-foreground);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.msg .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.msg .acts button{border:1px solid var(--border);background:var(--card);border-radius:999px;font-size:14px;height:32px;padding:0 12px}
.react{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:999px;font-size:12px;padding:0 6px;margin-top:4px}
.urgent{color:var(--destructive);font-weight:700;font-size:12px;display:flex;gap:4px;align-items:center}
.composer{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--card);border-top:1px solid var(--border);padding:8px 12px;z-index:19}
.composer .line{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:48px;max-height:120px;border:1.5px solid var(--input);border-radius:var(--r-md);padding:12px 14px;resize:none;font-size:16px}
.composer .opts{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted-foreground);margin-bottom:6px;flex-wrap:wrap}
/* money */
.bal{text-align:center;padding:20px 16px}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
/* kids */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.quick .card{margin:0}
.acc{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:8px;overflow:hidden}
.acc summary{padding:0 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;min-height:56px;align-items:center;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"";width:10px;height:10px;border-right:2px solid var(--muted-foreground);border-bottom:2px solid var(--muted-foreground);transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .15s}
.acc[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.acc .body{padding:0 16px 16px;font-size:16px}
.kv{display:grid;grid-template-columns:42% 1fr;gap:8px 12px;font-size:14px;line-height:20px;margin:0}
.kv dt{color:var(--muted-foreground)} .kv dd{margin:0;font-weight:500}
.ecard{background:var(--card);border:2px solid var(--destructive);border-radius:var(--r-lg);padding:16px}
.ecard h2{color:var(--destructive);margin-top:0;display:flex;gap:8px;align-items:center}
.ecard .sec{border-top:1px solid var(--border);padding:10px 0}
.ecard .sec b{display:block;font-size:12px;line-height:16px;text-transform:uppercase;color:var(--muted-foreground);letter-spacing:.05em;margin-bottom:2px}
/* overlay */
.overlay{position:fixed;inset:0;background:rgba(20,25,28,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--background);width:100%;max-width:430px;max-height:92vh;overflow:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:20px 16px 24px}
.sheet .grab{width:40px;height:4px;background:var(--input);border-radius:4px;margin:-8px auto 16px}
.sheet h2{margin-top:0}
.dialog{align-items:center;padding:20px}
.dialog .sheet{border-radius:var(--r-lg);max-width:360px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--foreground);color:var(--card);padding:12px 16px;border-radius:var(--r-md);font-size:14px;line-height:20px;z-index:60;max-width:90%;text-align:center}
.signup{padding:24px 16px}
.signup .logo{font-size:32px;line-height:40px;font-weight:700;margin:24px 0 8px}
.steps{display:flex;gap:4px;margin-bottom:20px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--border)}
.steps i.on{background:var(--primary)}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:var(--r-lg);background:var(--muted);margin:8px 0}
.tabs2 button{border:0;background:transparent;height:44px;border-radius:var(--r-md);font-size:14px;font-weight:600;color:var(--muted-foreground)}
.tabs2 button.on{background:var(--card);color:var(--foreground)}
.code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--muted);padding:2px 6px;border-radius:6px;word-break:break-all}
hr.s{border:0;border-top:1px solid var(--border);margin:16px 0}
</style>
</head>
<body>
<div id="app" class="phone"></div>
<script>
/* ============================================================
   THROWAWAY PROTOTYPE. Plain HTML, CSS and JS. No backend.
   Sample data lives in localStorage. All names are invented.
   ============================================================ */
const APP_NAME = 'APP_NAME';
document.title = APP_NAME + ' prototype';
const STORE = 'coparent-prototype-v1';

/* ---------- What each mode switches on (mirrors the planned modes.ts) ---------- */
const MODES = {
  cooperative: {
    label: 'Cooperative',
    wordCheck: false,
    editWindowMin: 5,
    reactions: true,
    removeFromView: true,
    topicRequired: false,
    quietHours: null,
    floodLimit: null,
    detailedReceipts: false,
    scheduleLocked: false,
    swapReasonRequired: false,
    requestExpiryHours: null,
    receiptRequired: false,
    autoApproveUnder: 500,
    queryReasonRequired: false,
    handoverCheckIn: false,
    handoverNotes: true,
    packingList: true,
    todos: true,
    journal: false,
    notifyMedicalChange: false,
  },
  high_conflict: {
    label: 'High-conflict',
    wordCheck: true,
    editWindowMin: 0,
    reactions: false,
    removeFromView: false,
    topicRequired: true,
    quietHours: { from: 20, to: 7 },
    floodLimit: { count: 5, minutes: 10 },
    detailedReceipts: true,
    scheduleLocked: true,
    swapReasonRequired: true,
    requestExpiryHours: 48,
    receiptRequired: true,
    autoApproveUnder: 0,
    queryReasonRequired: true,
    handoverCheckIn: true,
    handoverNotes: false,
    packingList: false,
    todos: false,
    journal: true,
    notifyMedicalChange: true,
  },
};

/* ---------- Word check list (English and Afrikaans). Sample only. ---------- */
const WORDS = ['idiot','stupid','useless','pathetic','moron','liar','loser','bitch','bastard','fuck','fucking','shit','crap','dumb','hate','idioot','dom','kak','fok','fokken','poes','doos','bliksem','vark','sleg','bek','hol','gat','pateties','leuenaar'];
function wordCheck(text){
  const lower = text.toLowerCase();
  return WORDS.some(w => new RegExp('(^|[^\\p{L}])' + w + '($|[^\\p{L}])', 'u').test(lower));
}


/* ---------- Icons (inline stroke SVG, as in the design canvas) ---------- */
const ICON = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  calendar:'<rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
  chat:'<path d="M5 4.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-5 4v-4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z"/>',
  money:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18M15.5 15h2"/>',
  kids:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M17.5 15a4.5 4.5 0 0 1 4 5"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  chev:'<path d="m9 6 6 6-6 6"/>',
  back:'<path d="m15 6-6 6 6 6"/>',
  lock:'<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  alert:'<path d="M12 4 2.5 20h19zM12 10v4.5M12 17.5v.01"/>',
  swap:'<path d="M4 8h15l-3-3M20 16H5l3 3"/>',
  pin:'<path d="M9 3h6l-1 6 3 3v2H7v-2l3-3zM12 14v7"/>',
  doc:'<path d="M6 3h8l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14 3v4h4M8.5 13h7M8.5 17h5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const fDate = d => { d = typeof d === 'string' ? (d.length===10?parse(d):new Date(d)) : d; return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(); };
const fDay = d => { d = typeof d === 'string' ? parse(d) : d; return DAY[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; };
const fTime = t => { const d = new Date(t); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const fStamp = t => fDate(new Date(t))+', '+fTime(t);
const R = n => { const neg = n<0; n = Math.abs(n); const [a,b] = n.toFixed(2).split('.'); return (neg?'-':'')+'R\u00a0'+a.replace(/\B(?=(\d{3})+(?!\d))/g,' ')+'.'+b; };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const age = dob => { const b = parse(dob), n = new Date(); let a = n.getFullYear()-b.getFullYear(); if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--; return a; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
function fakeHash(s){ let h1=0x811c9dc5,h2=0x1234567; for (const c of s){ h1=Math.imul(h1^c.charCodeAt(0),16777619); h2=Math.imul(h2+c.charCodeAt(0),2654435761);} return ((h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0')); }

/* ---------- Care schedule ---------- */
function careOn(dateStr){
  if (S.overrides[dateStr]) return S.overrides[dateStr];
  const d = parse(dateStr), a = parse(S.anchor);
  const weeks = Math.floor(Math.round((d - a)/86400000)/7);
  const even = ((weeks % 2) + 2) % 2 === 0;
  return even ? S.firstWeek : (S.firstWeek==='me'?'other':'me');
}
function nextHandover(){
  for (let i=0;i<14;i++){ const d = iso(addDays(new Date(), i)); const prev = iso(addDays(parse(d), -1)); if (careOn(d)!==careOn(prev)) return { date:d, to:careOn(d), from:careOn(prev) }; }
  return null;
}

      ? (checked ? `<p class="note">${I('check')}Checked in at ${fTime(checked.at)}. Time and a one-off location stamp recorded.</p>` : `<button class="btn block" style="margin-top:12px" data-a="sheet" data-v="checkin">Check in at handover</button>`)
      : `<p class="note">${I('clock')}Check-in opens on the day.</p>`;
    if (M().handoverNotes || M().packingList) h += `<div class="links">${M().handoverNotes?`<button class="btn text" data-a="sheet" data-v="handoverNote">Handover note</button>`:''}${M().packingList?`<button class="btn text" data-a="sheet" data-v="packing">Packing list ${S.packing.filter(p=>p.on).length}/${S.packing.length}</button>`:''}</div>`;
    h += `</section>`;
  }

  // 3. Anything waiting on you
  const items = [];
  pendReq.forEach(r=> items.push(`<button class="row" data-a="sheet" data-v="request" data-id="${r.id}"><span class="grow">${esc(r.text)}<div class="sub">${S.other} asked${M().requestExpiryHours?' · respond by '+fStamp(new Date(new Date(r.at).getTime()+M().requestExpiryHours*3600000)):''}</div></span><span class="chev">${I('chev')}</span></button>`));
  pendExp.forEach(e=> items.push(`<button class="row" data-a="sheet" data-v="expense" data-id="${e.id}"><span class="grow">Approve ${esc(e.title.toLowerCase())}, <span class="amt">${R(e.amount)}</span><div class="sub">Added by ${S.other}</div></span><span class="chev">${I('chev')}</span></button>`));
  if (unread) items.push(`<button class="row" data-a="tab" data-v="messages"><span class="grow">${unread} new message${unread>1?'s':''}</span><span class="chev">${I('chev')}</span></button>`);
  h += `<section class="flat-sec"><div class="lbl">Needs you${items.length?` (${items.length})`:''}</div>${items.length ? `<div class="flat">${items.join('')}</div>` : `<p class="muted" style="margin:4px 0 0">Nothing right now.</p>`}</section>`;

  // 4. Coming up, short
  h += `<section class="flat-sec"><div class="lbl">Coming up</div><div class="flat">${evs.map(e=>`<button class="row" data-a="sheet" data-v="event" data-id="${e.id}"><span class="when"><b>${e.date===TODAY?'Today':fDay(e.date).slice(0,3)+' '+parse(e.date).getDate()}</b><br>${e.time}</span><span class="grow">${esc(e.title)}</span></button>`).join('') || '<p class="muted">Nothing planned</p>'}</div>
    <button class="btn text" style="padding:0;margin-top:4px" data-a="tab" data-v="calendar">See calendar</button></section>`;
  return h;
}
/* ---------- Calendar ---------- */
function calendar(){
  const base = S.ui.calMonth ? parse(S.ui.calMonth) : new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  const y = base.getFullYear(), m = base.getMonth();
  const first = new Date(y,m,1), start = addDays(first, -((first.getDay()+6)%7));
  let h = '';
  if (M().scheduleLocked) h += `<div class="banner lock">${I('lock')}<span class="bt">The care schedule follows your parenting plan (signed 3 Mar 2026). It can’t be edited directly. Use a formal change request.</span></div>`;
  h += `<div class="card"><div class="calhead"><button class="iconbtn" data-a="calNav" data-v="-1">‹</button><b>${['January','February','March','April','May','June','July','August','September','October','November','December'][m]} ${y}</b><button class="iconbtn" data-a="calNav" data-v="1">›</button></div>
    <div class="grid">${['M','T','W','T','F','S','S'].map(d=>`<div class="dow">${d}</div>`).join('')}`;
  for (let i=0;i<42;i++){
    const d = addDays(start,i), ds = iso(d), c = careOn(ds);
    const marks = [];
    if (S.events.some(e=>e.date===ds)) marks.push('<i class="m"></i>');
    if (HOLIDAYS[ds]) marks.push('<i class="m hol"></i>');
    if (TERMS[ds]) marks.push('<i class="m term"></i>');
    if (S.overrides[ds]) marks.push('<i class="m swap"></i>');
    h += `<button class="day ${c} ${d.getMonth()!==m?'out':''} ${ds===TODAY?'today':''}" data-a="sheet" data-v="day" data-id="${ds}">${d.getDate()}<span class="marks">${marks.join('')}</span></button>`;
  }
  h += `</div><div class="legend"><span><i class="sw" style="background:var(--parent-a-soft);border:1.5px solid var(--parent-a)"></i>You</span><span><i class="sw" style="background:var(--parent-b-soft);border:1.5px solid var(--parent-b-border)"></i>${S.other}</span><span><i class="m" style="width:8px;height:8px;border-radius:50%;background:var(--foreground);display:inline-block"></i>Event</span><span><i style="width:8px;height:8px;border-radius:50%;background:var(--destructive);display:inline-block"></i>Public holiday</span><span><i style="width:8px;height:8px;border-radius:50%;background:var(--primary);display:inline-block"></i>School term</span><span><i style="width:8px;height:8px;border-radius:50%;background:var(--foreground);border-radius:1px;transform:rotate(45deg);display:inline-block"></i>Changed day</span></div></div>`;
  h += `<div class="btns" style="margin-top:0"><button class="btn" data-a="sheet" data-v="newRequest">${M().swapReasonRequired?'Request a change':'Ask for a swap'}</button><button class="btn ghost" data-a="sheet" data-v="newEvent">Add event</button></div>`;
  h += `<h3>Schedule</h3><div class="card small"><b>Week on, week off</b><div class="muted">Handover Fridays at ${S.handover.time}, ${esc(S.handover.place)}</div><hr class="s"><b>Special days</b><div class="muted">Christmas alternates each year (2026 with you). Birthdays: the other parent has 15:00 to 18:00. Mother’s Day with Naledi, Father’s Day with Johan.</div>${M().scheduleLocked?'':'<div class="btns"><button class="btn ghost sm" data-a="toast" data-v="Prototype: template picker (week on/off, 2-2-3, alternate weekends, custom)">Change template</button></div>'}</div>`;
  const reqs = S.requests.slice().reverse();
  h += `<h3>Change requests</h3><div class="card tight">${reqs.map(r=>`<button class="row" data-a="sheet" data-v="request" data-id="${r.id}"><span class="grow">${esc(r.text)}<div class="sub">${r.from==='me'?'You asked':S.other+' asked'} · ${fStamp(r.at)}</div></span>${statusPill(r.status)}</button>`).join('') || '<div class="row muted">None</div>'}</div>`;
  return h;
}
function badge(cls, icon, text){ return `<span class="pill ${cls}">${I(icon,'s')}${text}</span>`; }
function statusPill(s){ return ({pending:badge('wait','clock','Waiting'),accepted:badge('ok','check','Accepted'),declined:badge('warn','x','Declined'),expired:badge('','clock','Expired'),approved:badge('ok','check','Approved'),queried:badge('caution','info','Queried'),paid:badge('ok','check','Paid')})[s] || s; }

/* ---------- Messages ---------- */
function messages(){
  if (S.solo) return `<div class="card"><b>Messages start when ${S.other} joins</b><p class="small muted">You’ll talk in the app, so neither of you sees the other’s number or email.</p><button class="btn block" data-a="toast" data-v="Invite link copied">Copy invite link</button></div>`;
  const topics = S.topics.filter(t => !(M().topicRequired && t==='General'));
  if (!S.ui.chatTopic) {
    let h = '';
    if (M().quietHours) h += `<div class="banner lock">Quiet hours ${pad(M().quietHours.from)}:00 to ${pad(M().quietHours.to)}:00. Messages sent then arrive at ${pad(M().quietHours.to)}:00 unless marked urgent.</div>`;
    h += `<p class="small muted" style="margin-top:0">${M().topicRequired?'Every message sits under a topic.':'Keep school, medical, money and schedule talk apart.'}</p><div class="card tight">`;
    topics.forEach(t=>{
      const ms = S.messages.filter(m=>m.topic===t); const last = ms[ms.length-1];
      const un = ms.filter(m=>m.from==='other'&&!m.readAt).length;
      h += `<button class="row" data-a="openTopic" data-v="${t}"><span class="av kid" style="width:40px;height:40px">${t[0]}</span><span class="grow"><b>${t}</b><div class="sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${last? (last.removed?'Removed from view':esc(lastText(last))) : 'No messages yet'}</div></span>${un?`<span class="pill reply">${I('chat','s')}${un} new</span>`:''}<span class="chev">${I('chev')}</span></button>`;
    });
    if (S.mode==='high_conflict' && S.messages.some(m=>m.topic==='General')) h += `<div class="row small muted">Older messages under General stay in the record and the export.</div>`;
    return h + `</div>`;
  }
  // mark read
  S.messages.forEach(m=>{ if (m.topic===S.ui.chatTopic && m.from==='other' && !m.readAt) m.readAt = NOW().toISOString(); });
  const list = S.messages.filter(m=>m.topic===S.ui.chatTopic);
  let h = '';
  if (S.mode==='high_conflict') h += `<div class="banner lock">${I('lock')}<span class="bt">Messages are locked. They can’t be edited or deleted after sending.</span></div>`;
  h += `<div class="chat" style="padding-bottom:${S.mode==='high_conflict'?120:90}px">`;
  list.forEach(m=>{
    const mine = m.from==='me', txt = lastText(m), edited = m.revisions.length>0;
    const canEdit = mine && M().editWindowMin && (Date.now()-new Date(m.at).getTime()) < M().editWindowMin*60000 && !m.removed;
    if (m.removed && S.mode==='cooperative') { h += `<div class="msg ${mine?'mine':''} removed">Message removed from view<div class="meta">${fTime(m.at)} · kept in the record</div></div>`; return; }
    h += `<div class="msg ${mine?'mine':''}">${m.urgent?'<div class="urgent">URGENT</div>':''}${esc(txt)}
      ${m.reactions.length?`<div>${m.reactions.map(r=>`<span class="react">${r}</span>`).join(' ')}</div>`:''}
      <div class="meta">${M().detailedReceipts
        ? `Sent ${fStamp(m.at)}${m.deliveredAt?' · Delivered '+fTime(m.deliveredAt):m.heldUntil?' · Held until '+fTime(m.heldUntil):''}${m.readAt?' · Read '+fTime(m.readAt):''}`
        : `${fDay(m.at.slice(0,10))} ${fTime(m.at)}${edited?' · edited':''}${mine?(m.readAt?' · Read':' · Sent'):''}`}
        ${edited && S.mode==='high_conflict' ? ' · edited earlier' : ''}${m.removed && S.mode==='high_conflict' ? ' · was removed from view in Cooperative mode':''}</div>
      ${(M().reactions && !mine) || canEdit || (mine && M().removeFromView) ? `<div class="acts">
        ${M().reactions && !mine ? ['👍','❤️','🙏'].map(e=>`<button data-a="react" data-id="${m.id}" data-v="${e}">${e}</button>`).join('') : ''}
        ${canEdit?`<button data-a="sheet" data-v="editMsg" data-id="${m.id}">Edit</button>`:''}
        ${mine && M().removeFromView?`<button data-a="removeMsg" data-id="${m.id}">Remove from view</button>`:''}
      </div>`:''}
    </div>`;
  });
  return h + `</div>`;
}
function lastText(m){ return m.revisions.length ? m.revisions[m.revisions.length-1].text : m.text; }
function composer(){
  const hc = S.mode==='high_conflict';
  return `<div class="composer">
    ${hc?`<div class="opts"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="urgent" ${S.ui.urgent?'checked':''} data-a="urgentToggle"> Urgent (about the children’s safety or health)</label></div>`:''}
    <div class="line"><textarea id="msgText" placeholder="Message about ${esc(S.ui.chatTopic).toLowerCase()}">${esc(S.ui.draft||'')}</textarea><button class="btn" data-a="send">Send</button></div>
    ${hc?`<div class="small muted" style="margin-top:4px">Tip: try a word like “idiot” or “dom” to see the word check.</div>`:''}
  </div>`;
}

/* ---------- Money ---------- */
function balance(){
  // positive = other owes me
  let b = 0;
  S.expenses.forEach(e=>{ if (e.status!=='approved') return; const otherShare = e.amount*(e.paidBy==='me' ? (100-e.split) : e.split)/100; b += e.paidBy==='me' ? otherShare : -otherShare; });
  S.payments.forEach(p=>{ b += p.from==='other' ? -p.amount : p.amount; });
  return Math.round(b*100)/100;
}
function money(){
  const b = balance();
  let h = `<div class="card bal"><div class="muted small">Balance after approved expenses and payments</div><div class="big" style="font-size:28px;margin:6px 0">${b===0?'All square':R(Math.abs(b))}</div><div class="small">${b>0?S.other+' owes you':b<0?'You owe '+S.other:''}</div>
    <div class="btns"><button class="btn" data-a="sheet" data-v="newExpense">Add expense</button><button class="btn ghost" data-a="sheet" data-v="payment">Record payment</button></div></div>`;
  if (S.mode==='cooperative') h += `<div class="banner">Expenses under ${R(M().autoApproveUnder)} approve automatically. Settle up once a month.</div>`;
  else h += `<div class="banner lock">Strict expenses: a receipt is required, a query must give a reason, and nothing approves automatically.</div>`;
  h += `<h3>Expenses</h3><div class="card tight">${S.expenses.slice().reverse().map(e=>`<button class="row" data-a="sheet" data-v="expense" data-id="${e.id}"><span class="grow">${esc(e.title)}${e.recurring?' <span class="pill">Monthly</span>':''}<div class="sub">${esc(e.kid)} · paid by ${nameOf(e.paidBy).toLowerCase()==='you'?'you':S.other} · ${e.split}/${100-e.split} · ${fDate(e.at)}</div></span><span style="text-align:right"><div class="amt">${R(e.amount)}</div>${statusPill(e.status)}${e.auto?'<div class="small muted">auto</div>':''}</span></button>`).join('')}</div>`;
  h += `<h3>Payments</h3><div class="card tight">${S.payments.slice().reverse().map(p=>`<div class="row"><span class="grow">${p.from==='me'?'You paid '+S.other:S.other+' paid you'}<div class="sub">${fDate(p.at)} · ${esc(p.note||'')} ${p.proof?'· proof attached':''}</div></span><span class="amt">${R(p.amount)}</span></div>`).join('')}</div>`;
  const mt = S.maintenance;
  h += `<h3>Maintenance</h3><div class="card tight"><div class="row"><span class="grow"><b>${R(mt.amount)} a month</b><div class="sub">Due on the ${mt.due}st, paid by ${S.other}</div></span></div>
    ${mt.rows.map(r=>{ const late = parse(r.date).getDate()>mt.due+2, short = r.paid<mt.amount; return `<div class="row"><span class="grow">${r.month}<div class="sub">Paid ${fDate(r.date)}</div></span><span style="text-align:right"><div class="amt">${R(r.paid)}</div><div style="display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px">${short?badge('warn','alert','Short '+R(mt.amount-r.paid)):''}${late?badge('caution','clock','Late'):''}${!short&&!late?badge('ok','check','On time'):''}</div></span></div>`; }).join('')}</div>`;
  h += `<h3>Recurring costs</h3><div class="card tight">${S.recurring.map(r=>`<div class="row"><span class="grow">${esc(r.title)}<div class="sub">${esc(r.kid)} · repeats on the ${r.day}st</div></span><span class="amt">${R(r.amount)}</span></div>`).join('')}</div>`;
  h += `<div class="btns"><button class="btn ghost" data-a="toast" data-v="Prototype: monthly statement PDF for Nov 2026">Monthly statement</button><button class="btn ghost" data-a="toast" data-v="Prototype: yearly statement PDF for 2026">Yearly statement</button></div>`;
  return h;
}

/* ---------- Kids ---------- */
function kidsTab(){
  if (S.ui.kid) return kidProfile(S.children.find(c=>c.id===S.ui.kid));
  let h = S.children.map(c=>`<button class="card row" style="border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:12px;padding:12px 12px 12px 16px" data-a="openKid" data-id="${c.id}"><span class="av kid">${c.short[0]}</span><span class="grow"><b>${esc(c.name)}</b><div class="sub">${age(c.dob)} years · ${esc(c.grade)}, ${esc(c.school)}</div>${c.allergies.length?`<div style="margin-top:6px">${badge('warn','alert','Allergy: '+c.allergies.map(a=>esc(a.what)).join(', '))}</div>`:''}</span><span class="chev">${I('chev')}</span></button>`).join('');
  h += `<button class="btn ghost block" data-a="toast" data-v="Prototype: add a child profile">Add a child</button>`;
  h += `<h3>Document vault</h3><div class="card tight">${S.documents.map(d=>`<button class="row" data-a="toast" data-v="Prototype: opens through a short-lived private link"><span class="grow">${d.pinned?I('pin','s')+' ':''}${esc(d.name)}<div class="sub">${esc(d.kind)}${d.pinned?' · pinned as the reference':''}</div></span><span class="chev">${I('chev')}</span></button>`).join('')}<div class="row"><button class="btn sm ghost" data-a="toast" data-v="Prototype: upload a document">Upload document</button></div></div>`;

function kidProfile(c){
  const lastVisit = c.visits.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
  let h = `<button class="btn ghost sm" data-a="closeKid">‹ All children</button>
  <div class="card" style="margin-top:10px"><div class="who"><span class="av kid" style="width:56px;height:56px;font-size:22px">${c.short[0]}</span><div><div class="big">${esc(c.name)}</div><div class="small muted">${age(c.dob)} years (born ${fDate(c.dob)}) · ${esc(c.grade)}</div></div></div>
  <div class="btns"><button class="btn warn block" data-a="sheet" data-v="ecard" data-id="${c.id}">Emergency card</button></div></div>`;
  if (M().notifyMedicalChange) h += `<div class="banner lock">Changes to medical info are logged and ${S.other} is notified.</div>`;
  h += `<div class="quick"><div class="card small"><b style="color:var(--destructive)">Allergies</b><div>${c.allergies.length?c.allergies.map(a=>esc(a.what)).join(', '):'None known'}</div></div>
    <div class="card small"><b>Last doctor visit</b><div>${lastVisit?fDate(lastVisit.date)+'<br>'+esc(lastVisit.doctor)+': '+esc(lastVisit.outcome):'None'}</div></div></div>`;
  const acc = (title, body, open) => `<details class="acc" ${open?'open':''}><summary>${title}</summary><div class="body">${body}</div></details>`;
  const kv = o => `<dl class="kv">${Object.entries(o).map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)||'<span class="muted">Not added</span>'}</dd>`).join('')}</dl>`;
  h += acc('Basics', kv({'Full name':c.name,'Date of birth':fDate(c.dob),'Age':age(c.dob)+' years','School':c.school,'Grade':c.grade,'Teacher':c.teacher}));
  h += acc('Allergies', c.allergies.length ? c.allergies.map(a=>`<p><b>${esc(a.what)}</b><br><span class="muted">Reaction:</span> ${esc(a.reaction)}<br><span class="muted">What to do:</span> ${esc(a.action)}</p>`).join('') : '<p class="muted">None known</p>');
  h += acc('Medical basics', kv({'Blood type':c.blood,'Weight':c.weight}) + (c.conditions.length?`<p><b>Conditions</b></p>`+c.conditions.map(x=>`<p>${esc(x.what)}: <span class="muted">${esc(x.manage)}</span></p>`).join(''):'<p class="muted">No ongoing conditions</p>'));
  h += acc('Medication', c.meds.length ? c.meds.map(x=>kv({'Medicine':x.name,'Dose':x.dose,'When':x.times,'Prescribed by':x.by})).join('<hr class="s">') : '<p class="muted">None</p>');
  h += acc('Medical aid', kv({'Scheme':c.aid.scheme,'Plan':c.aid.plan,'Member number':c.aid.number,'Main member':c.aid.main,'Dependant code':c.aid.dep}));
  h += acc('Doctors', c.doctors.map(d=>`<p><b>${esc(d.role)}</b>: ${esc(d.name)}<br><span class="muted">${esc(d.where)} · ${esc(d.phone)}</span></p>`).join(''));
  h += acc('Visit log', c.visits.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(v=>kv({'Date':fDate(v.date),'Doctor':v.doctor,'Reason':v.reason,'Outcome':v.outcome,'Medicine':v.meds,'Follow-up':v.follow?fDate(v.follow):'','Who took them':v.took,'Attached':v.file})).join('<hr class="s">') + `<div class="btns"><button class="btn sm" data-a="sheet" data-v="visit" data-id="${c.id}">Add a visit</button></div>`);
  h += acc('Vaccinations', c.vacc.map(v=>`<p>${esc(v.what)} <span class="muted">· ${fDate(v.date)}</span></p>`).join('') + `<button class="btn sm ghost" data-a="toast" data-v="Prototype: photo of the clinic card">Clinic card photo</button>`);
  h += acc('Emergency contacts', c.contacts.map((x,i)=>`<p>${i+1}. <b>${esc(x.name)}</b><br><span class="muted">${esc(x.phone)}</span></p>`).join(''));
  h += acc('Day-to-day', kv({'Clothes':c.daily.clothes,'Shoes':c.daily.shoes,'Diet':c.daily.diet,'Bedtime':c.daily.bedtime,'Comfort item':c.daily.comfort}));
  h += acc('School', kv({'Office':c.schoolInfo.office,'Times':c.schoolInfo.timetable,'Aftercare':c.schoolInfo.aftercare,'Extramurals':c.schoolInfo.extra}));
  return h;
}

/* ---------- Sheets and dialogs ---------- */
function overlay(){
  const s = S.ui.sheet, dialog = s.type==='wordcheck' || s.type==='confirm';
  return `<div class="overlay ${dialog?'dialog':''}" data-a="closeOverlay"><div class="sheet" data-stop="1">${dialog?'':'<div class="grab"></div>'}${sheetBody(s)}</div></div>`;
}
function sheetBody(s){
  const close = `<button class="btn ghost" data-a="close">Close</button>`;
  switch(s.type){
  case 'wordcheck': return `<h2 style="font-size:18px">Are you sure you want to send this?</h2><p class="muted">Messages can’t be edited or deleted after sending.</p><div class="btns" style="flex-direction:column"><button class="btn" data-a="close">Edit message</button><button class="btn ghost" data-a="sendAnyway">Send anyway</button></div>`;
  case 'confirm': return `<h2 style="font-size:18px">${s.title}</h2><p class="muted">${s.text}</p><div class="btns"><button class="btn ghost" data-a="close">Cancel</button><button class="btn" data-a="${s.ok}">${s.okLabel}</button></div>`;
  case 'more': return `<h2>More</h2><div class="card tight">
      <button class="row" data-a="sheet" data-v="modeSettings"><span class="grow">Mode<div class="sub">${M().label}</div></span><span class="chev">${I('chev')}</span></button>
      ${M().journal?`<button class="row" data-a="sheet" data-v="journal"><span class="grow">Private journal<div class="sub">Only you can see it</div></span><span class="chev">${I('chev')}</span></button>`:''}
      ${M().todos?`<button class="row" data-a="sheet" data-v="todos"><span class="grow">Shared to-dos<div class="sub">${S.todos.filter(t=>!t.done).length} open</div></span><span class="chev">${I('chev')}</span></button>`:''}
      ${M().packingList?`<button class="row" data-a="sheet" data-v="packing"><span class="grow">Packing list</span><span class="chev">${I('chev')}</span></button>`:''}
      <button class="row" data-a="sheet" data-v="records"><span class="grow">Records and export<div class="sub">Everything that’s been logged</div></span><span class="chev">${I('chev')}</span></button>

function kvSimple(o){ return `<dl class="kv card">${Object.entries(o).map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`; }

/* ---------- Actions ---------- */
let toastTimer;
function toast(t){ S.ui.toast = t; render(); clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ S.ui.toast = null; render(); }, 2600); }
const val = id => (document.getElementById(id)?.value || '').trim();
function sheet(type, extra={}){ S.ui.sheet = { type, ...extra }; render(); }
function close(){ S.ui.sheet = null; render(); }

function inQuietHours(){ const q = M().quietHours; if (!q) return false; const h = new Date().getHours(); return h >= q.from || h < q.to; }
function doSend(text){
  const now = NOW();
  const fl = M().floodLimit;
  if (fl) {
    S.sentTimes = S.sentTimes.filter(t => now - new Date(t) < fl.minutes*60000);
    if (S.sentTimes.length >= fl.count) { S.ui.sheet = null; toast(`Limit reached: ${fl.count} messages in ${fl.minutes} minutes. Try again shortly.`); return; }
    S.sentTimes.push(now.toISOString());
  }
  const held = inQuietHours() && !S.ui.urgent;
  let heldUntil = null; if (held){ const d = new Date(); if (d.getHours()>=M().quietHours.from) d.setDate(d.getDate()+1); d.setHours(M().quietHours.to,0,0,0); heldUntil = d.toISOString(); }
  const m = { id:uid(), topic:S.ui.chatTopic, from:'me', text, at:now.toISOString(), deliveredAt: held?null:now.toISOString(), heldUntil, readAt:null, revisions:[], removed:false, urgent:!!S.ui.urgent && S.mode==='high_conflict', reactions:[] };
  S.messages.push(m); log(`Sent message (${S.ui.chatTopic})${m.urgent?' marked urgent':''}`);
  S.ui.draft = ''; S.ui.urgent = false; S.ui.sheet = null;
  render(); scrollDown();
  if (!held) setTimeout(()=>{ m.readAt = new Date().toISOString(); const x = S.messages.find(y=>y.id===m.id); if (x) x.readAt = m.readAt; render(); }, 4000);
}
function scrollDown(){ setTimeout(()=>window.scrollTo(0, document.body.scrollHeight), 30); }

const A = {
  protoMode(v){ S.mode = v; S.modeRequest = null; if (v==='high_conflict' && S.ui.chatTopic==='General') S.ui.chatTopic = null; render(); },
  reset(){ try { localStorage.removeItem(STORE); } catch(e){} S = load(); render(); },
  tab(v){ S.tab = v; S.ui.chatTopic = null; S.ui.kid = null; S.ui.sheet = null; render(); window.scrollTo(0,0); },
  tabKidsDocs(){ S.tab='kids'; S.ui.kid=null; S.ui.sheet=null; render(); setTimeout(()=>window.scrollTo(0, document.body.scrollHeight),30); },
  sheet(v, el){ sheet(v, { id: el.dataset.id, date: el.dataset.id }); },
  close, closeOverlay(v, el, ev){ if (ev.target === el) close(); },
  toast(v){ toast(v); },
  // sign-up
  via(v){ S.ui.form.via = v; render(); },
  step(v){ if (S.ui.step===4 || +v===4) {} S.ui.step = +v; render(); },
  consent(v, el){ S.ui.form.consent = el.checked; render(); },
  pickMode(v){ S.ui.form.mode = v; render(); },
  skipSignup(){ S.signedUp = true; S.ui = {}; render(); },
  finish(v){ const n = val('childName'), d = val('childDob'); if (n){ S.children[0].name = n; S.children[0].short = n.split(' ')[0]; } if (d) S.children[0].dob = d; S.mode = S.ui.form.mode; S.solo = v==='solo'; S.signedUp = true; log('Consent recorded (policy v0.1)'); log('Space created in '+MODES[S.mode].label+' mode'); S.ui = {}; if (v==='invite') toast('Invite link copied'); else render(); },
  joinOther(){ S.solo = false; log(S.other+' joined the space', 'other'); toast(S.other+' joined'); },
  // today
  todo(v, el){ const t = S.todos.find(x=>x.id===el.dataset.id); t.done = el.checked; log((t.done?'Ticked':'Unticked')+' to-do: '+t.text); render(); },
  addTodo(){ const t = val('todoText'); if (!t) return; S.todos.push({ id:uid(), text:t, who:'me', done:false }); log('Added to-do: '+t); render(); },
  pack(v, el){ S.packing[+el.dataset.id].on = el.checked; render(); },
  resetPacking(){ S.packing.forEach(p=>p.on=false); render(); },
  doCheckIn(){ const at = NOW().toISOString(); S.checkIns.push({ at, who:'me', place:'One-off location stamp' }); log('Handover check-in with one-off location stamp'); S.ui.sheet=null; toast('Checked in at '+fTime(at)); },
  saveHandoverNote(){ const ticks = [...document.querySelectorAll('.hn:checked')].map(x=>x.value); const t = [ticks.join(', '), val('hnText')].filter(Boolean).join('. '); if (!t) return; S.handoverNotes.push({ at:NOW().toISOString(), from:'me', text:t }); log('Sent handover note'); S.ui.sheet=null; toast('Note sent'); },
  addJournal(){ const t = val('jText'); if (!t) return; S.journal.push({ id:uid(), at:NOW().toISOString(), text:t }); render(); },
  // calendar
  calNav(v){ const b = S.ui.calMonth ? parse(S.ui.calMonth) : new Date(new Date().getFullYear(), new Date().getMonth(), 1); b.setMonth(b.getMonth()+ +v); S.ui.calMonth = iso(b); render(); },
  sendRequest(){
    const a = val('rqA'), b = val('rqB'), r = val('rqReason');
    if (!a) return toast('Pick a day');
    if (M().swapReasonRequired && !r) return toast('A reason is required in High-conflict mode');
    S.requests.push({ id:uid(), from:'me', kind:b?'swap':'change', dates:b?[a,b]:[a], text: b ? 'Swap '+fDay(a)+' for '+fDay(b) : 'Change '+fDay(a), reason:r, status:'pending', at:NOW().toISOString() });
    log('Sent change request: '+(b?'swap '+fDate(a)+' for '+fDate(b):'change '+fDate(a))); S.ui.sheet=null; toast('Request sent to '+S.other);
  },
  answerReq(v, el){ const r = S.requests.find(x=>x.id===el.dataset.id); r.status = v; r.answerReason = val('declineReason'); r.answeredAt = NOW().toISOString(); if (v==='accepted') applySwap(r); log((v==='accepted'?'Accepted':'Declined')+' change request: '+r.text); S.ui.sheet=null; toast(v==='accepted'?'Accepted. The calendar is updated.':'Declined'); },
  simAnswer(v, el){ const r = S.requests.find(x=>x.id===el.dataset.id); r.status='accepted'; applySwap(r); log('Accepted change request: '+r.text, 'other'); S.ui.sheet=null; toast(S.other+' accepted'); },
  saveEvent(){ const t = val('evTitle'); if (!t) return toast('Add a title'); S.events.push({ id:uid(), title:t, date:val('evDate'), time:val('evTime'), place:val('evPlace'), kid:val('evKid'), notes:val('evNotes'), by:'me' }); log('Added event: '+t); S.ui.sheet=null; toast('Event added'); },
  // messages
  openTopic(v){ S.ui.chatTopic = v; render(); scrollDown(); },
  closeTopic(){ S.ui.chatTopic = null; render(); },
  urgentToggle(v, el){ S.ui.urgent = el.checked; S.ui.draft = val('msgText'); },
  send(){ const t = val('msgText'); if (!t) return; S.ui.draft = t; if (M().wordCheck && wordCheck(t)) { sheet('wordcheck'); return; } doSend(t); },
  sendAnyway(){ doSend(S.ui.draft); },
  react(v, el){ const m = S.messages.find(x=>x.id===el.dataset.id); m.reactions = m.reactions.includes(v) ? m.reactions.filter(r=>r!==v) : [...m.reactions, v]; render(); },
  saveEdit(v, el){ const m = S.messages.find(x=>x.id===el.dataset.id); const t = val('editText'); if (!t) return; m.revisions.push({ text:t, at:NOW().toISOString() }); log('Edited message (original kept)'); S.ui.sheet=null; render(); },
  removeMsg(v, el){ const m = S.messages.find(x=>x.id===el.dataset.id); m.removed = true; log('Removed message from view (kept in record)'); render(); },
  // money
  approveExp(v, el){ const e = S.expenses.find(x=>x.id===el.dataset.id); e.status='approved'; log('Approved expense: '+e.title); S.ui.sheet=null; toast('Approved'); },
  queryExp(v, el){ const e = S.expenses.find(x=>x.id===el.dataset.id); const r = val('qReason'); if (M().queryReasonRequired && !r) return toast('Give a reason for the query'); e.status='queried'; e.query = r || 'Queried'; log('Queried expense: '+e.title); S.ui.sheet=null; toast('Query sent'); },
  simApproveExp(v, el){ const e = S.expenses.find(x=>x.id===el.dataset.id); e.status='approved'; log('Approved expense: '+e.title, 'other'); S.ui.sheet=null; toast(S.other+' approved'); },
  saveExpense(){
    const t = val('exTitle'), a = parseFloat(val('exAmt').replace(',','.').replace(/\s/g,'')), rc = document.getElementById('exReceipt').checked;
    if (!t || !(a>0)) return toast('Add what it was for and the amount');
    if (M().receiptRequired && !rc) return toast('A receipt is required in High-conflict mode');
    const auto = M().autoApproveUnder && a < M().autoApproveUnder;
    S.expenses.push({ id:uid(), title:t, cat:val('exCat'), kid:val('exKid'), amount:a, paidBy:'me', split:+val('exSplit'), receipt:rc, status:auto?'approved':'pending', auto, at:NOW().toISOString() });
    log('Added expense: '+t+' ('+R(a)+')'); S.ui.sheet=null; toast(auto?'Added and approved automatically':'Added. Waiting for '+S.other);
  },
  savePayment(){ const a = parseFloat(val('payAmt').replace(',','.')); if (!(a>0)) return toast('Enter an amount'); if (M().receiptRequired && !document.getElementById('payProof').checked) return toast('Attach proof of payment'); S.payments.push({ id:uid(), from:'me', to:'other', amount:a, at:NOW().toISOString(), proof:document.getElementById('payProof').checked?'Proof.pdf':'', note:val('payNote') }); log('Recorded payment: '+R(a)); S.ui.sheet=null; toast('Payment recorded'); },
  // kids
  openKid(v, el){ S.ui.kid = el.dataset.id; render(); window.scrollTo(0,0); },
  closeKid(){ S.ui.kid = null; render(); },
  saveVisit(v, el){ const c = S.children.find(x=>x.id===el.dataset.id); c.visits.push({ date:val('vDate'), doctor:val('vDoc'), reason:val('vReason'), outcome:val('vOut'), meds:val('vMeds'), follow:val('vFollow'), took:'Naledi', file:'' }); log('Added doctor visit for '+c.short); S.ui.sheet=null; toast(M().notifyMedicalChange?'Saved. '+S.other+' has been notified.':'Saved'); },
  // mode
  confirmHC(){ sheet('confirm', { title:'Switch to High-conflict?', text:'This takes effect straight away for both of you. Going back to Cooperative will need '+S.other+' to agree.', ok:'doHC', okLabel:'Switch' }); },
  doHC(){ S.mode='high_conflict'; S.ui.chatTopic=null; log('Switched space to High-conflict mode'); S.ui.sheet=null; toast('Now in High-conflict mode'); },
  askCoop(){ if (S.solo){ S.mode='cooperative'; log('Switched space to Cooperative mode'); S.ui.sheet=null; toast('Now in Cooperative mode'); return; } S.modeRequest = { at:NOW().toISOString() }; log('Asked to switch back to Cooperative mode'); sheet('modeSettings'); },
  simAcceptMode(){ S.mode='cooperative'; S.modeRequest=null; log('Accepted switch to Cooperative mode', 'other'); S.ui.sheet=null; toast(S.other+' accepted. Now in Cooperative mode'); },
  exportPdf(){ S.ui.exported = true; log('Exported record as PDF'); sheet('records'); },
};
function applySwap(r){ if (r.kind==='swap'){ const [a,b] = r.dates; const ca = careOn(a), cb = careOn(b); S.overrides[a] = cb; S.overrides[b] = ca; } else { S.overrides[r.dates[0]] = careOn(r.dates[0])==='me'?'other':'me'; } }

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el) return;
  if (el.dataset.a === 'closeOverlay' && ev.target !== el) return;
  if (el.type === 'checkbox') return; // handled on change
  const f = A[el.dataset.a]; if (f) { ev.preventDefault(); f(el.dataset.v, el, ev); }
});
document.addEventListener('change', ev => {
  const el = ev.target; if (el.type !== 'checkbox' || !el.dataset.a) return;
  const f = A[el.dataset.a]; if (f) f(el.dataset.v, el, ev);
});
document.addEventListener('input', ev => { if (ev.target.id === 'msgText') S.ui.draft = ev.target.value; });
render();
</script>
</body>
</html>
